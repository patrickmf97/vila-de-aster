<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1515" />
  <title>Vila de Aster</title>
</head>
<body>
  <main id="app">
    <div id="game" aria-label="RPG 2D Vila de Aster"></div>

    <div id="top-left" class="hud glass">
      <div class="brand">🌿 Vila de Aster</div>
      <div class="sub">v0.4 • Life Simulation</div>
    </div>

    <div id="top-right" class="hud glass stats">
      <div><span id="dayIcon">☀️</span> <strong id="clock">08:00</strong></div>
      <div id="dayText">Dia 1</div>
      <div id="populationText">5 moradores</div>
    </div>

    <div id="quest" class="hud glass quest">
      <strong>Objetivo atual</strong>
      <span>Observe a vila: os moradores agora têm casa, sono, relações e família.</span>
    </div>

    <div id="hint" class="hint hidden">Pressione <kbd>E</kbd> para interagir</div>

    <section id="dialogue" class="dialogue hidden" aria-live="polite">
      <div class="portrait" id="portrait">🙂</div>
      <div class="dialogue-content">
        <div class="dialogue-name" id="dialogueName">NPC</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="dialogue-footer">E / Enter para continuar</div>
      </div>
    </section>

    <div id="toast" class="toast hidden" aria-live="polite"></div>

    <div id="help" class="help glass">
      <span><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> mover</span>
      <span><kbd>E</kbd> interagir</span>
      <span><kbd>R</kbd> reiniciar simulação</span>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
